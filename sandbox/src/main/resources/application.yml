spring:
  application:
    name: sandbox

  datasource:
    url: jdbc:mysql://localhost:3326/condition?useSSL=false&allowPublicKeyRetrieval=true
    username: master
    password: condition!
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  mvc:
    async:
      request-timeout: 600000
